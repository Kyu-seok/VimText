<!doctype html><html><head><meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.core.css" rel="stylesheet">
<link href="/prosemirror.css" rel="stylesheet">
<style>.ProseMirror{white-space:pre-wrap} #bare{white-space:pre-wrap}</style>
</head><body>
<div id="host"></div>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="/pm.js"></script>
<script type="module">
import * as L from 'https://esm.sh/lexical@0.53.0';
import {registerRichText} from 'https://esm.sh/@lexical/rich-text@0.53.0?deps=lexical@0.53.0';
import {registerHistory, createEmptyHistoryState} from 'https://esm.sh/@lexical/history@0.53.0?deps=lexical@0.53.0';
import React from 'https://esm.sh/react@18.3.1';
import {createRoot} from 'https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1';
import {createEditor as createSlate, Node as SNode} from 'https://esm.sh/slate@0.147.4';
import {Slate, Editable, withReact} from 'https://esm.sh/slate-react@0.147.5?deps=react@18.3.1,react-dom@18.3.1,slate@0.147.4,slate-dom@0.147.3';
import {withHistory} from 'https://esm.sh/slate-history@0.144.0?deps=slate@0.147.4';
window.ERRS = [];
window.addEventListener('error', e => ERRS.push(String(e.message || e.error)));
window.addEventListener('unhandledrejection', e => ERRS.push('rej ' + String(e.reason)));
const hostDiv = document.getElementById('host');
// fixture: array of paragraphs, each an array of [text, bold]
const M = {};
M.lexical = (paras) => {
  const root = document.createElement('div'); root.contentEditable = 'true'; hostDiv.append(root);
  const ed = L.createEditor({onError: e => ERRS.push('lexical ' + String(e))});
  ed.setRootElement(root); window.LEX = ed;
  registerRichText(ed);
  ed.update(() => { const r = L.$getRoot(); r.clear(); for (const p of paras) { const pn = L.$createParagraphNode(); for (const [t,b] of p) { const tn = L.$createTextNode(t); if (b) tn.toggleFormat('bold'); pn.append(tn);} r.append(pn);} }, {discrete: true});
  registerHistory(ed, createEmptyHistoryState(), 1000);
  root.focus();
  return {root, model: () => ed.getEditorState().read(() => L.$getRoot().getChildren().map(n => n.getTextContent())), undo: () => ed.dispatchCommand(L.UNDO_COMMAND, undefined)};
};
M.quill = (paras) => {
  const d = document.createElement('div'); hostDiv.append(d);
  const q = new Quill(d, {});
  const ops = []; paras.forEach(p => { for (const [t,b] of p) ops.push(b ? {insert: t, attributes: {bold: true}} : {insert: t}); ops.push({insert: '\n'}); });
  q.setContents(ops); q.history.clear(); q.focus();
  return {root: q.root, model: () => q.getText().replace(/\n$/, '').split('\n'), undo: () => q.history.undo()};
};
M.slate = (paras) => new Promise(res => {
  const ed = withHistory(withReact(createSlate())); window.SLATE = ed;
  const init = paras.map(p => ({type: 'paragraph', children: p.map(([t,b]) => b ? {text: t, bold: true} : {text: t})}));
  const d = document.createElement('div'); hostDiv.append(d);
  const renderLeaf = ({attributes, children, leaf}) => React.createElement(leaf.bold ? 'strong' : 'span', attributes, children);
  createRoot(d).render(React.createElement(Slate, {editor: ed, initialValue: init}, React.createElement(Editable, {id: 'slateed', renderLeaf})));
  setTimeout(() => { const root = document.getElementById('slateed'); root.focus();
    res({root, model: () => ed.children.map(n => SNode.string(n)), undo: () => ed.undo()}); }, 300);
});
const toHtml = paras => paras.map(p => '<p>' + p.map(([t,b]) => b ? `<strong>${t}</strong>` : t).join('') + '</p>').join('');
M.prosemirror = (paras) => {
  const d = document.createElement('div'); hostDiv.append(d);
  const {view, undo} = mountPM(d, toHtml(paras)); window.PMV = view; view.focus();
  const model = () => { const out = []; view.state.doc.forEach(b => out.push(b.textContent)); return out; };
  return {root: view.dom, model, undo};
};
M.bare = (paras) => {
  const root = document.createElement('div'); root.id = 'bare'; root.contentEditable = 'true'; root.innerHTML = toHtml(paras); hostDiv.append(root); root.focus();
  return {root, model: () => Array.from(root.children).map(b => b.textContent), undo: () => document.execCommand('undo')};
};
window.mount = async (name, paras) => {
  window.E = await M[name](paras);
  E.root.addEventListener('input', e => (window.INPUTS ||= []).push(e.inputType), true);
  E.root.addEventListener('beforeinput', e => (window.BIS ||= []).push((e.isTrusted ? 'T:' : 'S:') + e.inputType), true);
};
window.blocks = () => Array.from(E.root.children);
window.textAt = (bi, off) => { const w = document.createTreeWalker(blocks()[bi], NodeFilter.SHOW_TEXT); let n, last = null;
  while ((n = w.nextNode())) { if (n.parentElement.closest('[data-slate-zero-width],.ql-cursor')) continue; last = n; if (off <= n.data.length) return [n, off]; off -= n.data.length; }
  return last ? [last, last.data.length] : [blocks()[bi], 0]; };
window.settle = () => document.dispatchEvent(new Event('selectionchange'));
window.sel = (b1,o1,b2,o2) => { const [a,ao]=textAt(b1,o1), [f,fo]=textAt(b2,o2); document.getSelection().setBaseAndExtent(a,ao,f,fo); };
window.state = () => ({dom: blocks().map(b=>b.textContent.replace(/﻿/g,'')), model: E.model()});
// one step: cfg.mode 'exec' (today) | 'bi' (beforeinput then exec fallback) | 'biOnly'
window.step = (cfg, cmd, value, log) => {
  const s = document.getSelection(); const r = s.rangeCount ? s.getRangeAt(0) : null;
  const rec = {cmd, value};
  if (cfg.mode !== 'exec') {
    const inputType = cmd === 'insertText' ? 'insertText' : cmd === 'insertParagraph' ? 'insertParagraph' : cfg.deleteType;
    let target = E.root;
    if (cfg.target === 'anchor') { const n = s.anchorNode; target = n.nodeType === 3 ? n.parentElement : n; }
    const targetRanges = cfg.noRanges || !r ? [] : [new StaticRange({startContainer: r.startContainer, startOffset: r.startOffset, endContainer: r.endContainer, endOffset: r.endOffset})];
    const ev = new InputEvent('beforeinput', {inputType, data: cmd === 'insertText' ? value : null, bubbles: true, cancelable: true, composed: true, targetRanges});
    target.dispatchEvent(ev);
    rec.inputType = inputType; rec.prevented = ev.defaultPrevented;
  }
  if (cfg.mode === 'exec' || (cfg.mode === 'bi' && !rec.prevented)) rec.exec = document.execCommand(cmd, false, value);
  settle(); log.push(rec);
};
const pause = t => t === 'ms20' ? new Promise(r => setTimeout(r, 20)) : t === 'micro' ? Promise.resolve() : t === 'task' ? new Promise(r => setTimeout(r, 0)) : t === 'raf' ? new Promise(r => requestAnimationFrame(() => r())) : null;
// write = replaceDomRange; ops: [{sel:[b1,o1,b2,o2], text}] or {cont:true,text} (no reselect)
window.write = (cfg, ops) => {
  const log = []; const steps = [];
  for (const op of ops) {
    if (op.sel) steps.push(['sel', op.sel]);
    if (op.text === '') steps.push(['cmd', 'delete']);
    else op.text.split('\n').forEach((part, i) => { if (i > 0) steps.push(['cmd', 'insertParagraph']); if (part) steps.push(['cmd', 'insertText', part]); });
  }
  const doIt = (s) => { if (s[0] === 'sel') { sel(...s[1]); settle(); } else step(cfg, s[1], s[2], log); };
  if (!cfg.timing || cfg.timing === 'sync') { steps.forEach(doIt); return log; }
  return (async () => { for (let i = 0; i < steps.length; i++) { if (i > 0) await pause(cfg.timing); doIt(steps[i]); } return log; })();
};
window.READY = true;
</script></body></html>
