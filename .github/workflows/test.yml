name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies to install — the engine is tested with Node's built-in runner.
      - run: node --test
      - name: Verify committed bundle matches sources
        run: |
          node tools/bundle.mjs
          git diff --exit-code content-scripts/vimtext.js
