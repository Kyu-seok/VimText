<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VimText</title>
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 14px 16px;
        font: 13px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
        color: #1b1b1b;
        background: #fff;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot { width: 10px; height: 10px; border-radius: 3px; background: #0b6e4f; display: inline-block; }
      label { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
      label.disabled { opacity: 0.5; cursor: default; }
      .host { font-family: ui-monospace, Menlo, monospace; }
      a { color: #1e6fd6; text-decoration: none; font-size: 12px; }
      hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
      .hint { color: #777; font-size: 11px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span> VimText</h1>
    <label><input type="checkbox" id="enabled" /> Enable VimText</label>
    <label id="siteRow"><input type="checkbox" id="siteDisabled" /> Disable on <span class="host" id="host">this site</span></label>
    <hr />
    <a href="#" id="openOptions">Manage per-site list…</a>
    <p class="hint">Focus a text field and press <b>Esc</b> or <b>Ctrl+[</b> to enter Normal mode.</p>
    <script src="popup.js"></script>
  </body>
</html>
