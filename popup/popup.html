<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VimText</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 0; padding: 12px; width: 260px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  select { flex: 1; }
  .origin { color: #666; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a { color: #0b57d0; font-size: 12px; }
</style>
</head>
<body>
  <h1>VimText</h1>
  <label><input type="checkbox" id="enabled"> Enabled everywhere</label>
  <div class="origin" id="origin"></div>
  <label>This site <select id="policy">
    <option value="insert">On, start in Insert</option>
    <option value="normal">On, start in Normal</option>
    <option value="off">Off</option>
  </select></label>
  <a href="#" id="options">Options…</a>
  <script src="popup.js"></script>
</body>
</html>
