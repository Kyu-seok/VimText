<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VimText fixture: Field taller than the viewport</title>
    <style>
      body {
        margin: 0;
      }
      .spacer {
        height: 1500px;
      }
      textarea {
        display: block;
        margin: 0 40px;
        width: 300px;
        height: 3000px;
        font:
          14px/1.4 Menlo,
          monospace;
      }
    </style>
  </head>
  <body>
    <div class="spacer"></div>
    <textarea id="ta">a long answer, taller than the viewport</textarea>
    <div class="spacer"></div>
  </body>
</html>
