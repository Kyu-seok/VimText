<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VimText fixture: Atoms</title>
    <style>
      body {
        font-family: system-ui;
        margin: 40px;
      }
      [contenteditable="true"] {
        width: 480px;
        min-height: 120px;
        padding: 4px;
        border: 1px solid #888;
        font:
          14px/1.4 Menlo,
          monospace;
      }
      [contenteditable="true"] p {
        margin: 0;
      }
      .mention {
        background: #dde8ff;
        border-radius: 4px;
        padding: 0 2px;
      }
      img {
        width: 16px;
        height: 16px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <h1>VimText fixture: Atoms</h1>
    <!-- A bare contenteditable holding two Atoms: a non-editable mention chip and an inline image. No whitespace between tags (whitespace is a projection rule of its own), hence the prettier-ignore. -->
    <!-- prettier-ignore -->
    <div id="ce" contenteditable="true"><p>hi <span class="mention" contenteditable="false">@alice</span> and <img alt="cat" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='orange'/%3E%3C/svg%3E"> ok</p><p>next line</p></div>
  </body>
</html>
