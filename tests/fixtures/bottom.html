<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VimText fixture: Field flush with the bottom</title>
    <style>
      body {
        margin: 0;
      }
      textarea {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 60px;
        margin: 0;
        box-sizing: border-box;
        font:
          14px/1.4 Menlo,
          monospace;
      }
    </style>
  </head>
  <body>
    <textarea id="ta">flush with the bottom</textarea>
  </body>
</html>
