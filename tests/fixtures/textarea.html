<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VimText fixture: textarea</title>
    <style>
      body {
        font-family: system-ui;
        margin: 40px;
      }
      textarea {
        width: 480px;
        height: 160px;
        font:
          14px/1.4 Menlo,
          monospace;
      }
      input {
        width: 320px;
        font:
          14px Menlo,
          monospace;
      }
      #log {
        font: 12px monospace;
        color: #555;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <h1>VimText fixture</h1>
    <p>
      <textarea id="ta">
the quick brown fox
jumps over the lazy dog
third line here</textarea>
    </p>
    <form
      id="form"
      onsubmit="
        event.preventDefault();
        document.getElementById('log').textContent += 'submit\n';
      "
    >
      <p><input id="in" type="text" value="hello world" /></p>
    </form>
    <p><button id="btn">button</button></p>
    <div id="log"></div>
    <script>
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") document.getElementById("log").textContent += "page-esc\n";
      });
    </script>
  </body>
</html>
