<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VimText Options</title>
    <style>
      body {
        max-width: 620px;
        margin: 40px auto;
        padding: 0 20px;
        font: 14px/1.6 system-ui, -apple-system, Segoe UI, sans-serif;
        color: #1b1b1b;
      }
      h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
      .dot { width: 12px; height: 12px; border-radius: 3px; background: #0b6e4f; display: inline-block; }
      label.block { display: flex; align-items: center; gap: 8px; margin: 16px 0; }
      textarea {
        width: 100%;
        min-height: 140px;
        font: 13px/1.5 ui-monospace, Menlo, monospace;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        resize: vertical;
      }
      button {
        margin-top: 10px;
        padding: 7px 16px;
        border: none;
        border-radius: 6px;
        background: #0b6e4f;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: #095c42; }
      .muted { color: #666; font-size: 13px; }
      .status { color: #0b6e4f; margin-left: 10px; font-size: 13px; }
      code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span> VimText Options</h1>

    <label class="block"><input type="checkbox" id="enabled" /> Enable VimText globally</label>

    <h2 style="font-size: 15px">Disabled sites</h2>
    <p class="muted">One hostname per line (e.g. <code>github.com</code>). VimText will stay out of the way on these sites. <code>docs.google.com</code> is always excluded (canvas editor, unsupported).</p>
    <textarea id="sites" placeholder="example.com&#10;mail.google.com"></textarea>
    <div>
      <button id="save">Save</button>
      <span class="status" id="status"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
