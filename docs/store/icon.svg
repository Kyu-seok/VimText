<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Chrome Web Store icon: 96x96 artwork centred in 16px of transparent padding.
       A dark terminal tile with Vim's :wq and a block cursor, in Vim green. Not the Vim
       logo: VimText is not the Vim project. The text uses Menlo; icon-128.png was rendered
       on macOS, so re-render there (or swap in another bold monospace) after an edit. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a24"/>
      <stop offset="1" stop-color="#0e1713"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="16.5" y="16.5" width="95" height="95" rx="21.5" fill="none" stroke="#3fcf6a" stroke-opacity=".35"/>
  <text x="24" y="72" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-weight="700" font-size="36"
        letter-spacing="-1" fill="#3fcf6a">:wq</text>
  <rect x="88" y="45" width="14" height="32" rx="1.5" fill="#d8f5e0"/>
  <path d="M16 92 H112 V90 A22 22 0 0 1 90 112 H38 A22 22 0 0 1 16 90 Z" fill="#3fcf6a" fill-opacity=".16"/>
  <text x="64" y="104.5" text-anchor="middle" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-weight="700"
        font-size="9" letter-spacing=".5" fill="#3fcf6a" fill-opacity=".9">-- NORMAL --</text>
</svg>
